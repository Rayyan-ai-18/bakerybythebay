<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery by the Bay - Feedback</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <a href="../menu/index.html" class="btn-back">← Back to Menu</a>

        <section class="feedback-container">
            <div class="feedback-form">
                <h1>We'd Love to Hear From You!</h1>
                <p>Your feedback helps us improve our bakery and services.</p>

                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>

                <form id="feedbackForm">
                    <div class="input-group">
                        <label for="feedbackName">Name (optional)</label>
                        <input type="text" id="feedbackName" placeholder="Your name">
                    </div>

                    <div class="input-group">
                        <label for="feedbackPhone">Phone (optional)</label>
                        <input type="tel" id="feedbackPhone" placeholder="Your phone number">
                    </div>

                    <div class="input-group">
                        <label for="feedbackMessage">Message</label>
                        <textarea id="feedbackMessage" rows="5" placeholder="What did you think of our bakery today?" required></textarea>
                    </div>

                    <div class="input-group">
                        <label for="feedbackRating">Rating (optional)</label>
                        <div class="rating-stars">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                        <input type="hidden" id="feedbackRatingValue" value="">
                    </div>

                    <button type="submit" class="btn btn-success btn-submit-feedback">
                        Send Feedback
                    </button>
                </form>

                <p class="feedback-note">
                    Note: Feedback is anonymous unless you provide your name or phone number.
                </p>
            </div>
        </section>
    </div>

    <script type="module" src="./js/feedback.js"></script>
</body>
</html>
