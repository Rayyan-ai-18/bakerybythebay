<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4A88C"/>
      <stop offset="100%" stop-color="#B09070"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bg)"/>

  <!-- Subtle grain texture -->
  <rect width="600" height="450" fill="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="300" cy="220" r="120" fill="rgba(255,255,255,0.12)"/>
  <circle cx="300" cy="220" r="80" fill="rgba(255,255,255,0.08)"/>

  <!-- Decorative top corner -->
  <circle cx="500" cy="-50" r="200" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="500" r="150" fill="rgba(255,255,255,0.05)"/>

  <!-- Product icon -->
  <g transform="translate(300, 215)" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250,260 C250,260 230,260 230,220 C230,180 260,160 300,160 C340,160 370,180 370,220 C370,260 350,260 350,260 Z M250,260 L250,290 L350,290 L350,260 M270,290 L270,310 L330,310 L330,290"/>
  </g>

  <!-- Separator -->
  <line x1="230" y1="320" x2="370" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Product name -->
  <text x="300" y="355" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="300" font-size="32" fill="rgba(255,255,255,0.85)" letter-spacing="0.02em">
    <tspan x="300" dy="0">Muffins</tspan>
    
  </text>

  <!-- Price -->
  <text x="300" y="398" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="16" fill="rgba(255,255,255,0.55)" letter-spacing="0.05em">$7.00</text>
</svg>