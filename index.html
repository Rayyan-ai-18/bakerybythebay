<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery by the Bay</title>
    <meta http-equiv="refresh" content="0; url=menu/">
    <link rel="stylesheet" href="styles.css">
    <style>
        .landing-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #fff5f5 0%, #fff 50%, #fff5f5 100%);
        }
        .landing-page h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .landing-page p {
            color: var(--text-light);
            font-size: 1.125rem;
            margin-bottom: 1rem;
        }
        .landing-page .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="landing-page">
        <div class="spinner"></div>
        <h1>Bakery by the Bay</h1>
        <p>Loading today's menu...</p>
        <a href="menu/" class="btn">Go to Menu</a>
    </div>
</body>
</html>
