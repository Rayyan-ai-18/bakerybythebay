<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery by the Bay - Admin Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="admin-login-page">
        <div class="login-card animate-fade-in-up">
            <div class="login-logo">
                <div class="login-logo-icon">🔒</div>
                <h1>Bakery Admin</h1>
                <p>Sign in to manage your bakery</p>
            </div>

            <div id="error-message" class="message message--error"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-input" type="email" id="email" placeholder="owner@bakerybythebay.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn--primary btn--lg btn--block">Login to Dashboard</button>
            </form>
        </div>
    </div>

    <script type="module" src="./js/admin-auth.js"></script>
</body>
</html>
